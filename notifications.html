<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora • Notification Center</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body>

    <header class="app-header">
        <div class="header-top">
            <div class="header-title">
                <h2>Notifications</h2>
                <span id="notifCounterText">0 Unread</span>
            </div>
            <div class="header-actions">
                <button id="markAllNotifsReadBtn" class="text-action-btn">Read All</button>
                <button id="clearNotifsBtn" class="action-icon-btn" title="Clear Notifications">🗑️</button>
            </div>
        </div>

        <div class="search-bar-wrapper">
            <input type="text" id="notifSearchInput" placeholder="Search notification content...">
        </div>

        <div class="filter-tabs">
            <button class="filter-chip active" data-cat="all">All</button>
            <button class="filter-chip" data-cat="calls">Calls</button>
            <button class="filter-chip" data-cat="security">Security</button>
            <button class="filter-chip" data-cat="system">System</button>
        </div>
    </header>

    <main class="page-content">
        <div id="notifContainer" class="notif-list"></div>
    </main>

    <nav class="bottom-nav">
        <a href="dashboard.html">
            <span>🏠</span>
            <span>Home</span>
        </a>
        <a href="contacts.html">
            <span>👥</span>
            <span>Contacts</span>
        </a>
        <a href="chat.html">
            <span>💬</span>
            <span>Chats</span>
        </a>
        <a href="dialpad.html">
            <span>📞</span>
            <span>Dial Pad</span>
        </a>
        <a href="recent.html">
            <span>🕒</span>
            <span>Recent</span>
        </a>
        <a href="settings.html">
            <span>⚙️</span>
            <span>Settings</span>
        </a>
    </nav>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script type="module" src="js/notifications.js"></script>
</body>
</html>
