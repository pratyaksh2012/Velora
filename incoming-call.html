<!DOCTYPE html>
<html>
<head>
<title>Incoming Call - Velora</title>
<link rel="stylesheet" href="css/calling.css">
</head>

<body>

<div class="call-box">

    <div class="call-icon">
        📞
    </div>

    <h1>Incoming Call</h1>

    <h2 id="callerName">
        Someone is calling...
    </h2>


    <div class="buttons">

        <button id="acceptBtn" class="accept">
            Accept
        </button>


        <button id="rejectBtn" class="reject">
            Reject
        </button>

    </div>

</div>


<script type="module" src="js/calling.js"></script>

</body>
</html>
